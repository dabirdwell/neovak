<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0d10">
<title>NeoVak</title>
<link rel="stylesheet" href="/ui/studio.css">
</head>
<body class="booting" data-page="studio">
<div class="ambient" aria-hidden="true"><div class="amb" id="ambA"></div><div class="amb" id="ambB"></div><div class="grainy"></div></div>

<header class="topbar">
  <div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5l8 9 8-9v14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>NeoVak</span></div>
  <button class="project-btn" id="projectBtn" title="Switch project"><span id="projectName">Project</span><svg viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
  <nav class="pages" id="pages" aria-label="Views">
    <button data-page="studio">Studio</button><button data-page="gallery">Gallery</button><button data-page="timeline">Timeline</button><button data-page="models">Models</button>
  </nav>
  <span class="grow"></span>
  <button class="queue-btn" id="queueBtn" title="Everything lined up and running"><span class="pip" id="queuePip"></span><span id="queueText">Nothing waiting</span></button>
  <div class="memory" id="memory" title="Memory this Mac can spare right now"><div class="mem-bar"><i id="memFill"></i></div><span id="memText" class="num">Checking</span></div>
  <button class="help-btn" id="helpBtn" title="How this works" aria-label="How this works">?</button>
  <button class="person-btn" id="personBtn" title="Signed in" aria-label="Signed in" aria-haspopup="menu" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M4.8 19.5c1.1-3.4 3.9-5.2 7.2-5.2s6.1 1.8 7.2 5.2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg><span id="personName"></span></button>
</header>

<div class="notice" id="notice" role="status" hidden><p></p><button aria-label="Dismiss">&times;</button></div>
<div class="hold-band" id="holdBand" role="status" hidden><span class="hold-dot" aria-hidden="true"></span><p></p><button aria-label="Hide this note">&times;</button></div>

<main class="studio" id="page-studio">
  <nav class="rail" id="lanes" role="tablist" aria-label="What to make"></nav>
  <div class="center">
    <section class="stage" id="stage">
      <div class="wall" id="wall"></div>
      <section class="preview" id="preview" hidden>
        <div class="plate"><img id="previewImg" alt="A still from your animation"><span class="tag">Preview</span></div>
        <p>Press Generate to make the moving version.</p>
      </section>
      <section class="board-wrap" id="boardWrap" hidden>
        <div class="board-head"><div class="board-words"><h2 id="boardTitle"></h2><p id="boardNote"></p></div><button class="ghost stop" id="boardStop" hidden>Stop</button><span class="work-aside" id="boardAside" hidden></span></div>
        <div class="board" id="board"></div>
      </section>
      <section class="working" id="working" hidden>
        <div class="frame" id="frame"><canvas id="grain"></canvas><div class="frame-words" id="frameWords" hidden><small>Being made from these words</small><span></span></div><img id="peekA" alt=""><img id="peekB" alt=""><div class="sheen"></div><div class="craft-in" id="craftIn"></div></div>
        <div class="live-page" id="livePage" hidden></div>
        <div class="work-label" id="workLabel"></div>
        <div class="work-prompt" id="workPrompt"></div>
        <div class="craft-slot" id="craft"></div>
        <div class="work-row"><span class="work-time num" id="workTime" role="status"></span><button class="ghost stop" id="stopBtn" hidden>Stop</button><span class="work-aside" id="workAside" hidden>Started from another page</span></div>
        <div class="held-offer" id="heldOffer" role="status" hidden></div>
      </section>
      <section class="result" id="result" hidden>
        <div class="canvas" id="canvas"></div>
        <div class="dots" id="dots" hidden></div>
        <div class="chain-strip" id="chainStrip" hidden></div>
      </section>
    </section>
    <div class="info" id="info" hidden>
      <div class="words"><div class="prompt" id="resultPrompt"></div><div class="meta num" id="resultMeta"></div></div>
      <div class="actions" id="actions"></div>
    </div>
    <div class="dock" id="dock">
      <div class="suggest" id="suggest" hidden>
        <div class="label" id="suggestLabel"></div>
        <div class="text" id="suggestText"></div>
        <div class="row" id="suggestRow"><button class="chip" id="suggestUse">Use this</button><button class="chip" id="suggestKeep">Keep mine</button></div>
        <div class="row" id="suggestBusy" hidden><button class="chip" id="suggestStop">Stop</button></div>
      </div>
      <div class="composer" id="composer">
        <div class="tpls" id="tpls" hidden></div>
        <div class="fields" id="recipeFields" hidden></div>
        <textarea id="prompt" aria-label="What do you want to create?" spellcheck="true" rows="2"></textarea>
        <div class="row">
          <button class="chip" id="enhanceBtn" title="Rewrite your words into a fuller description. You choose whether to keep it.">Improve my words</button>
          <button class="chip" id="surpriseBtn" title="Fill in a random idea">Surprise me</button>
          <button class="link" id="undoBtn" hidden>Undo</button>
          <span class="source-chip" id="sourceChip" hidden><img id="sourceThumb" alt=""><span id="sourceName"></span><button class="link" id="sourcePick">Choose</button><button class="link" id="sourceClear" hidden>Remove</button></span>
          <span class="seedlock num" id="seedLock" hidden title="This seed will be used for the next one"><span></span><button aria-label="Stop using this seed">&times;</button></span>
          <span class="grow"></span>
          <span class="model-chip" id="modelChip"><span class="dot"></span><span></span></span>
          <button class="chip settings" id="settingsBtn" aria-expanded="false" aria-controls="panel">Settings</button>
          <button class="primary" id="generateBtn">Generate</button>
        </div>
        <p class="why-blocked" id="whyBlocked" role="status" hidden></p>
        <p class="line-note" id="lineNote" role="status" hidden></p>
      </div>
    </div>
    <div class="film" id="film" aria-label="Recent work"></div>
  </div>
  <aside class="inspector" id="panel" aria-label="Settings">
    <div class="inspector-scroll">
      <div class="panel-head"><strong id="panelTitle">Settings</strong><button class="ghost close-sheet" id="panelClose">Done</button></div>
      <div id="panelBody"></div>
    </div>
  </aside>
</main>

<section class="page" id="page-gallery" hidden></section>
<section class="page" id="page-timeline" hidden></section>
<section class="page" id="page-models" hidden></section>

<nav class="phone-tabs" id="phoneTabs" aria-label="Views"></nav>

<div class="scrim" id="howScrim" hidden></div>
<aside class="side-sheet" id="how" aria-label="How this was made" hidden>
  <div class="panel-head"><strong>How this was made</strong><button class="ghost" id="howClose">Done</button></div>
  <div id="howBody"></div>
</aside>

<div class="popover" id="queuePop" hidden></div>
<div class="popover" id="projectPop" hidden></div>
<div class="popover" id="variationPop" hidden></div>
<div class="popover menu" id="morePop" hidden role="menu"></div>
<div class="popover menu" id="personPop" hidden role="menu"></div>

<section class="compare" id="compare" hidden>
  <div class="compare-head"><h2>Compare</h2><div class="seg" id="compareMode"><button class="sel" data-m="side">Side by side</button><button data-m="wipe">Slider</button></div><span class="grow"></span><button class="ghost" id="compareClose">Close</button></div>
  <div class="compare-panes" id="comparePanes"></div>
</section>

<section class="sheet-keys" id="keys" hidden>
  <div class="keys-card"><div class="panel-head"><strong>How this works</strong><button class="ghost" id="keysClose">Done</button></div><div id="keysBody"></div></div>
</section>

<div class="drop-veil" id="dropVeil" hidden><div>Drop to add it to this project</div></div>
<div class="toast" id="toast" role="status"></div>
<script src="/ui/base.js"></script>
<script src="/ui/fx.js"></script>
<script src="/ui/progress.js"></script>
<script src="/ui/stage.js"></script>
<script src="/ui/inspector.js"></script>
<script src="/ui/starters.js"></script>
<script src="/ui/library.js"></script>
<script src="/ui/timeline.js"></script>
<script src="/ui/models.js"></script>
<script src="/ui/boot.js"></script>
</body>
</html>
